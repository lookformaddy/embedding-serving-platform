[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embedserve"
version = "0.1.0"
description = "Versioned embedding serving platform: registry, ANN search, quotas, cache, drift, eval"
requires-python = ">=3.10"

[project.optional-dependencies]
api = ["fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.29"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
